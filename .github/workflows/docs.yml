name: Docs

# Builds the documentation site in docs/site and, on main, deploys it to GitHub Pages at
# https://eased-tech.github.io/switchkick/. The site also serves the config JSON Schema at the
# URL in its `$id`, so a schema change on main is published here.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/docs.yml
      - docs/site/**
      - eval/**
      - pnpm-lock.yaml
      - schema/**
  pull_request:
    paths:
      - .github/workflows/docs.yml
      - docs/site/**
      - eval/**
      - pnpm-lock.yaml
      - schema/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @switchkick/docs
      - run: pnpm --filter @switchkick/docs docs:build
      - name: Check links and the published schema
        run: pnpm --filter @switchkick/docs docs:check
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
