version: 2
updates:
  # Covers every workspace package through the root pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The types must match the oldest supported Node (engines: >=22.18), or code could compile
      # against APIs that Node 22 doesn't have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The image follows Node's LTS line (even majors). The tag already floats to the latest
      # 24.x on every build, so the next LTS major is moved to by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
